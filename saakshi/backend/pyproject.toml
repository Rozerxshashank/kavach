[project]
name = "saakshi"
version = "0.1.0"
description = "Saakshi — voice-verified work and income records for India's informal workers, on Gnani Timbre + Prisma"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]
