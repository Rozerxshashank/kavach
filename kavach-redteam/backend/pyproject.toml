[project]
name = "kavach"
version = "2.0.0"
description = "Kavach — voice-native red-teaming for AI call-centre agents, powered by Gnani Timbre + Prisma"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
